<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The magnetic field of a wire and a loop, by the Biot-Savart law</title>
<script src="mjlabel.js"></script>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573;
          --amber:#8a5a00; --red:#b01e24; --grn:#3f7d34; }
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:10px; padding:14px; }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px;
           touch-action:none; cursor:grab; }
  canvas.dragging { cursor:grabbing; }
  .controls { display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px 18px; align-items:center;
              padding:9px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  @media (max-width:620px) { .controls { grid-template-columns:1fr; } }
  .ctl { display:flex; align-items:center; gap:8px; min-width:0; overflow:hidden; }
  .ctl label { font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl .val { color:var(--navy); font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:48px; text-align:right; }
  .ctl input[type=range]{ flex:1 1 auto; min-width:70px; accent-color:var(--mid); }
  .ctl select { flex:1 1 auto; min-width:0; font:inherit; font-size:12.5px; color:var(--ink); padding:3px 4px;
                border:1px solid var(--edge2); border-radius:4px; background:#fff; }
  .readouts { display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; gap:4px; padding:7px 8px 8px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  .ro .k { display:block; text-align:center; height:15px; line-height:15px; font-size:10.5px; font-weight:700;
           text-transform:uppercase; letter-spacing:0.045em; color:var(--ink3); white-space:nowrap; overflow:hidden; }
  .ro .k mjx-container { font-size:inherit !important; }
  .ro .v { height:19px; line-height:19px; font-size:14.5px; font-weight:700; white-space:nowrap;
           font-variant-numeric:tabular-nums; text-align:center; min-width:8ch; color:var(--navy); }
</style>
</head>
<body>
<div class="app">
  <canvas id="plot" aria-label="A current-carrying wire or loop seen in a plane through it, the magnetic field around it, and a probe point where the field is measured. Drag the probe to move it."></canvas>

  <div class="controls">
    <div class="ctl">
      <label for="mode">Source</label>
      <select id="mode">
        <option value="wire">Finite wire</option>
        <option value="loop">Circular loop</option>
      </select>
    </div>
    <div class="ctl">
      <label>\(I\)</label>
      <input type="range" id="cur" min="0.5" max="10" step="0.5" value="1">
      <span class="val" id="cur-val">1 A</span>
    </div>
    <div class="ctl">
      <label id="size-lab">\(L\)</label>
      <input type="range" id="size" min="2" max="30" step="1" value="20">
      <span class="val" id="size-val">20 cm</span>
    </div>
  </div>

  <div class="readouts">
    <div class="ro"><span class="k">probe at</span><span class="v" id="r-pos">—</span></div>
    <div class="ro"><span class="k">\(|\mathbf{H}|\)</span><span class="v" id="r-h">—</span></div>
    <div class="ro"><span class="k">\(|\mathbf{B}|\)</span><span class="v" id="r-b">—</span></div>
    <div class="ro"><span class="k" id="r-ref-k">long-wire formula</span><span class="v" id="r-ref">—</span></div>
  </div>
</div>

<script>
'use strict';

const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SANS = 'Inter, system-ui, -apple-system, sans-serif';
function htext(ctx,str,x,y,px,color,align,bold){ ctx.font=(bold?'700 ':'')+px+'px '+SANS; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.lineJoin='round'; ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.strokeText(str,x,y); ctx.fillStyle=color; ctx.fillText(str,x,y); }
function stext(ctx,str,x,y,px,color,align,bold){ ctx.fillStyle=color; ctx.font=(bold?'700 ':'')+px+'px '+SANS; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(str,x,y); }

// The view is the x-z plane, distances in centimeters. Field values in A/m.
//
// Finite wire: along z from -L/2 to L/2 at x = 0, current +z. In this plane H is
// along y (into the page for x > 0, out of it for x < 0), and the Biot-Savart
// integral gives, at distance rho and height z,
//   H = I/(4 pi rho) [ (L/2 - z)/sqrt(rho^2 + (L/2 - z)^2) + (L/2 + z)/sqrt(rho^2 + (L/2 + z)^2) ].
//
// Loop: radius a in the plane z = 0, centered on the z axis, current
// counterclockwise seen from +z (out of the page at x = -a, into it at x = +a).
// H in the x-z plane is summed from N straight elements, I dl x R / (4 pi R^3).
const MU0 = 4e-7*Math.PI, CM = 0.01, SNAP = 0.5, NSEG = 120;
const state = { mode: 'wire', I: 1, L: 20, a: 6, probe: [5, 0] };

const modeEl = document.getElementById('mode'), curEl = document.getElementById('cur'), sizeEl = document.getElementById('size');
modeEl.addEventListener('change', () => {
  state.mode = modeEl.value;
  if (state.mode === 'wire'){ sizeEl.min = 2; sizeEl.max = 30; sizeEl.value = state.L; state.probe = [5, 0]; }
  else { sizeEl.min = 2; sizeEl.max = 10; sizeEl.value = state.a; state.probe = [0, 0]; }
  document.getElementById('size-lab').innerHTML = state.mode === 'wire' ? '\\(L\\)' : '\\(a\\)';
  document.getElementById('r-ref-k').innerHTML = state.mode === 'wire' ? 'long-wire formula' : 'on-axis formula';
  MJ.typeset(document.body).then(() => draw());
  update();
});
curEl.addEventListener('input', () => { state.I = parseFloat(curEl.value); update(); });
sizeEl.addEventListener('input', () => {
  if (state.mode === 'wire') state.L = parseFloat(sizeEl.value); else state.a = parseFloat(sizeEl.value);
  update();
});

// Precomputed loop elements (unit current, radius in cm), rebuilt when a changes.
let segs = [], segA = null;
function buildSegs(){
  if (segA === state.a) return;
  segA = state.a; segs = [];
  const a = state.a*CM, dphi = 2*Math.PI/NSEG;
  for (let k = 0; k < NSEG; k++){
    const p = (k + 0.5)*dphi;
    segs.push([a*Math.cos(p), a*Math.sin(p), -a*Math.sin(p)*dphi, a*Math.cos(p)*dphi]);
  }
}

// Field at (x, z) in cm: returns [Hx, Hy, Hz] in A/m.
function field(xc, zc){
  const I = state.I, x = xc*CM, z = zc*CM;
  if (state.mode === 'wire'){
    const rho = Math.abs(x); if (rho < 1e-6) return [0, 0, 0];
    const h = state.L*CM/2, up = h - z, dn = h + z;
    const H = I/(4*Math.PI*rho)*(up/Math.hypot(rho, up) + dn/Math.hypot(rho, dn));
    return [0, x > 0 ? H : -H, 0];
  }
  buildSegs();
  let hx = 0, hy = 0, hz = 0;
  for (const [sx_, sy_, dlx, dly] of segs){
    const Rx = x - sx_, Ry = -sy_, Rz = z;
    const R2 = Rx*Rx + Ry*Ry + Rz*Rz; if (R2 < 1e-10) continue;
    const s = I/(4*Math.PI*R2*Math.sqrt(R2));
    // dl x R with dl = (dlx, dly, 0)
    hx += s*(dly*Rz); hy += s*(-dlx*Rz); hz += s*(dlx*Ry - dly*Rx);
  }
  return [hx, hy, hz];
}

// ---- canvas: z spans -15 to 15 cm ----
const canvas = document.getElementById('plot');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, PX = 1;
function cvWidth(cv){ return Math.max(240, cv.clientWidth || Math.floor(cv.getBoundingClientRect().width)); }
function setSize(cv,wCss,hCss,dpr){
  cv.width=Math.round(wCss*dpr); cv.height=Math.round(hCss*dpr);
  cv.style.height=hCss+'px';
  const bh=cv.offsetHeight-cv.clientHeight; if(bh) cv.style.height=(hCss+bh)+'px';
}
function fit(){
  const dpr = window.devicePixelRatio || 1;
  W = cvWidth(canvas);
  H = Math.round(Math.max(230, Math.min(W*0.62, 330)));
  setSize(canvas, W, H, dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  PX = H / 32;                        // pixels per centimeter
  draw();
}
window.addEventListener('resize', fit);
const sx = x => W/2 + x*PX;
const sy = z => H/2 - z*PX;
const wx = px => (px - W/2)/PX;
const wz = py => -(py - H/2)/PX;

function arrowHead(x, y, ang, size, color){
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x + size*Math.cos(ang), y + size*Math.sin(ang));
  ctx.lineTo(x - size*Math.cos(ang - 0.5), y - size*Math.sin(ang - 0.5));
  ctx.lineTo(x - size*Math.cos(ang + 0.5), y - size*Math.sin(ang + 0.5));
  ctx.closePath(); ctx.fill();
}
function into(x, y, r, color, lw){
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x, y, r, 0, 2*Math.PI); ctx.fill(); ctx.stroke();
  const d = r*0.6; ctx.beginPath(); ctx.moveTo(x-d, y-d); ctx.lineTo(x+d, y+d); ctx.moveTo(x-d, y+d); ctx.lineTo(x+d, y-d); ctx.stroke();
}
function outof(x, y, r, color, lw){
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x, y, r, 0, 2*Math.PI); ctx.fill(); ctx.stroke();
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, Math.max(1.2, r*0.3), 0, 2*Math.PI); ctx.fill();
}

// Trace one field line of the loop from (x, z), both ways, until it closes on
// its start, reaches a wire, or leaves the view.
function traceLoop(x0, z0){
  const out = [];
  for (const dir of [1, -1]){
    const pts = [[x0, z0]]; let x = x0, z = z0; const ds = 0.12;
    for (let i = 0; i < 2500; i++){
      let [hx, , hz] = field(x, z); let m = Math.hypot(hx, hz); if (!m) break;
      const xm = x + 0.5*ds*dir*hx/m, zm = z + 0.5*ds*dir*hz/m;
      [hx, , hz] = field(xm, zm); m = Math.hypot(hx, hz); if (!m) break;
      x += ds*dir*hx/m; z += ds*dir*hz/m; pts.push([x, z]);
      if (Math.abs(x) > W/(2*PX) + 1 || Math.abs(z) > 17) break;
      if (i > 20 && Math.hypot(x - x0, z - z0) < ds*0.9){ pts.push([x0, z0]); out.push(pts); return out; }
    }
    out.push(pts);
  }
  return out;
}

function draw(){
  if (!W) return;
  ctx.clearRect(0,0,W,H);
  const navy = cssVar('--navy'), red = cssVar('--red'), amber = cssVar('--amber'), ink3 = cssVar('--ink3');

  // grid, 5 cm
  ctx.strokeStyle = '#eef3f8'; ctx.lineWidth = 1;
  for (let g = Math.ceil(wx(0)/5)*5; g <= wx(W); g += 5){ ctx.beginPath(); ctx.moveTo(sx(g),0); ctx.lineTo(sx(g),H); ctx.stroke(); }
  for (let g = -15; g <= 15; g += 5){ ctx.beginPath(); ctx.moveTo(0,sy(g)); ctx.lineTo(W,sy(g)); ctx.stroke(); }
  ctx.strokeStyle = '#c7d2e0';
  ctx.beginPath(); ctx.moveTo(0,sy(0)); ctx.lineTo(W,sy(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx(0),0); ctx.lineTo(sx(0),H); ctx.stroke();

  if (state.mode === 'wire'){
    // H points along y: a grid of symbols, sized by |H| on a log scale
    const step = 2.5;
    const hmax = state.I/(2*Math.PI*1.25*CM);
    for (let gx = Math.ceil(wx(8)/step)*step; gx <= wx(W-8); gx += step){
      if (Math.abs(gx) < 0.1) continue;
      for (let gz = -15 + step/2; gz <= 15; gz += step){
        const hy = field(gx, gz)[1], m = Math.abs(hy);
        const t = Math.max(0, Math.min(1, 1 + Math.log10(m/hmax)/2.2));
        if (t <= 0.02) continue;
        const r = 1.6 + 4.2*t, col = `rgba(0,74,133,${0.25 + 0.6*t})`;
        (hy > 0 ? into : outof)(sx(gx), sy(gz), r, col, 1);
      }
    }
    // the wire, with its current
    ctx.strokeStyle = red; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx(0), sy(-state.L/2)); ctx.lineTo(sx(0), sy(state.L/2)); ctx.stroke();
    ctx.lineCap = 'butt';
    arrowHead(sx(0), sy(state.L/2) - 4, -Math.PI/2, 8, red);
    htext(ctx, 'I', sx(0) + 9, sy(state.L/2) + 8, 15, red, 'left', true);
  } else {
    // field lines, seeded across the inside of the loop
    ctx.strokeStyle = '#7fa3c4'; ctx.lineWidth = 1.2;
    const a = state.a, seeds = [];
    for (let k = 1; k <= 5; k++){ const f = k/6; seeds.push(-a*f, a*f); }
    seeds.push(0);
    for (const s0 of seeds){
      for (const pts of traceLoop(s0, 0)){
        ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(sx(p[0]), sy(p[1])) : ctx.moveTo(sx(p[0]), sy(p[1]))); ctx.stroke();
      }
      const [hx, , hz] = field(s0, 0);
      arrowHead(sx(s0), sy(0), Math.atan2(-hz, hx), 5, '#7fa3c4');
    }
    // the two crossings of the loop
    outof(sx(-a), sy(0), 7, red, 2);
    into(sx(a), sy(0), 7, red, 2);
    stext(ctx, 'I', sx(-a) - 11, sy(0) - 11, 13, red, 'right', true);
  }

  // axis labels last, on a white halo, so the field symbols never cover them
  htext(ctx, 'x (cm)', W-8, sy(0)-10, 11, ink3, 'right', false);
  htext(ctx, 'z (cm)', sx(0)+6, 11, 11, ink3, 'left', false);
  for (let g = Math.ceil(wx(30)/10)*10; g <= wx(W-24); g += 10) if (g) htext(ctx, String(g), sx(g), sy(0)+11, 10.5, ink3, 'center', false);
  for (const g of [-10, 10]) htext(ctx, String(g), sx(0)-5, sy(g), 10.5, ink3, 'right', false);

  // the probe
  const [px, pz] = state.probe;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = amber; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(sx(px), sy(pz), 6, 0, 2*Math.PI); ctx.fill(); ctx.stroke();
  if (state.mode === 'loop'){
    const [hx, , hz] = field(px, pz), m = Math.hypot(hx, hz);
    if (m > 0){
      const L = 34, x0 = sx(px), y0 = sy(pz), x1 = x0 + L*hx/m, y1 = y0 - L*hz/m;
      ctx.strokeStyle = amber; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      arrowHead(x1, y1, Math.atan2(y1 - y0, x1 - x0), 8, amber);
    }
  }
  stext(ctx, 'probe', sx(px) + 9, sy(pz) + 14, 11, amber, 'left', true);
}

// ---- dragging the probe, snapped to a 0.5 cm grid ----
let drag = false;
function local(e){ const b = canvas.getBoundingClientRect(); return [e.clientX - b.left - canvas.clientLeft, e.clientY - b.top - canvas.clientTop]; }
canvas.addEventListener('pointerdown', e => {
  const [mx, my] = local(e);
  if (Math.hypot(mx - sx(state.probe[0]), my - sy(state.probe[1])) < 26){ drag = true; canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging'); }
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const [mx, my] = local(e);
  const x = Math.round(wx(mx)/SNAP)*SNAP, z = Math.max(-15, Math.min(15, Math.round(wz(my)/SNAP)*SNAP));
  if (x !== state.probe[0] || z !== state.probe[1]){ state.probe = [x, z]; update(); }
});
const endDrag = () => { drag = false; canvas.classList.remove('dragging'); };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

function sig3(v){
  const a = Math.abs(v);
  if (a === 0) return '0';
  if (a >= 100) return a.toFixed(0);
  if (a >= 10) return a.toFixed(1);
  if (a >= 1) return a.toFixed(2);
  return a.toPrecision(3);
}
const fmtP = v => (v < 0 ? '−' : '') + Math.abs(v);

function update(){
  document.getElementById('cur-val').textContent = state.I + ' A';
  document.getElementById('size-val').textContent = (state.mode === 'wire' ? state.L : state.a) + ' cm';
  const [px, pz] = state.probe;
  const h = field(px, pz), m = Math.hypot(h[0], h[1], h[2]);
  document.getElementById('r-pos').textContent = '(' + fmtP(px) + ', ' + fmtP(pz) + ') cm';
  const onWire = state.mode === 'wire' && px === 0;
  document.getElementById('r-h').textContent = onWire ? '—' : sig3(m) + ' A/m';
  document.getElementById('r-b').textContent = onWire ? '—' : sig3(MU0*m*1e6) + ' μT';
  let ref;
  if (state.mode === 'wire'){
    ref = px === 0 ? '—' : sig3(state.I/(2*Math.PI*Math.abs(px)*CM)) + ' A/m';
  } else {
    const a = state.a*CM, z = pz*CM;
    ref = px === 0 ? sig3(state.I*a*a/(2*Math.pow(a*a + z*z, 1.5))) + ' A/m' : 'off the axis';
  }
  document.getElementById('r-ref').textContent = ref;
  draw();
}

update();
fit();
MJ.setRedraw(()=>draw());
MJ.onReady(()=>{ MJ.typeset(document.body).then(()=>draw()); draw(); });
</script>
</body>
</html>
