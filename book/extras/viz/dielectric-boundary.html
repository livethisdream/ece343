<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The field at a material boundary</title>
<script src="mjlabel.js"></script>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573;
          --amber:#8a5a00; --red:#b01e24; --grn:#3f7d34;
          --f1:#004a85;    /* field in region 1 */
          --f2:#0067b9;    /* field in region 2 */
          --cmp:#8a5a00; } /* components and angles */
  html,body { margin:0; padding:0; font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .app { display:flex; flex-direction:column; gap:10px; padding:14px; }
  canvas { display:block; box-sizing:border-box; width:100%; height:auto; background:#fff; border:1px solid var(--edge); border-radius:6px; }
  .controls { display:grid; grid-template-columns:1fr 1fr; gap:9px 18px; align-items:center;
              padding:9px 12px; background:var(--bg); border:1px solid var(--edge); border-radius:6px; }
  @media (max-width:620px) { .controls { grid-template-columns:1fr; } }
  .ctl { display:flex; align-items:center; gap:8px; min-width:0; overflow:hidden; }
  .ctl label { font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl .val { color:var(--navy); font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:38px; text-align:right; }
  .ctl input[type=range]{ flex:1 1 auto; min-width:80px; accent-color:var(--mid); }
  .tgl { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; min-width:0; }
  .tgl input { position:absolute; opacity:0; pointer-events:none; }
  .tgl .sw { position:relative; flex:none; width:34px; height:19px; border-radius:999px;
             background:#dfe8f1; border:1px solid var(--edge2); transition:background .15s, border-color .15s; }
  .tgl .sw::after { content:''; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%;
                    background:#fff; box-shadow:0 1px 2px rgba(0,0,0,0.22); transition:transform .15s; }
  .tgl input:checked + .sw { background:var(--on,var(--mid)); border-color:var(--on,var(--mid)); }
  .tgl input:checked + .sw::after { transform:translateX(15px); }
  .tgl input:focus-visible + .sw { outline:2px solid var(--navy); outline-offset:2px; }
  .tgl .t { font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .tgl input:checked ~ .t { color:var(--on,var(--navy)); }
  .readouts { display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(148px, 1fr)); }
  .ro { display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
        gap:4px; padding:7px 8px 8px; min-width:0;
        border:1px solid var(--edge2); border-radius:6px; background:#eef4fa; }
  /* block, not flex: a flex container drops the whitespace between an inline
     MathJax symbol and the words that follow it, welding them together. */
  .ro .k { display:block; text-align:center;
           height:15px; line-height:15px; font-size:10.5px; font-weight:700;
           text-transform:uppercase; letter-spacing:0.045em; color:var(--ink3);
           white-space:nowrap; overflow:hidden; }
  .ro .k mjx-container { font-size:inherit !important; }
  .ro .v { height:19px; line-height:19px; font-size:14.5px; font-weight:700; white-space:nowrap;
           font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
           text-align:center; min-width:8ch; color:var(--navy); }
</style>
</head>
<body>
<div class="app">
  <canvas id="plot" aria-label="Electric field lines bending at the boundary between two dielectrics"></canvas>

  <div class="controls">
    <div class="ctl">
      <label id="l-1">\(\epsilon_{r1}\)</label>
      <input type="range" id="e1" min="1" max="10" step="0.1" value="1">
      <span class="val" id="e1-val">1.0</span>
    </div>
    <div class="ctl">
      <label id="l-2">\(\epsilon_{r2}\)</label>
      <input type="range" id="e2" min="1" max="10" step="0.1" value="4">
      <span class="val" id="e2-val">4.0</span>
    </div>
    <div class="ctl">
      <label>\(\theta_1\)</label>
      <input type="range" id="th" min="0" max="85" step="0.1" value="30">
      <span class="val" id="th-val">30.0°</span>
    </div>
    <div style="display:flex; gap:18px; flex-wrap:wrap;">
      <label class="tgl"><input type="checkbox" id="show-d"><span class="sw"></span><span class="t" id="l-d">Show D</span></label>
      <label class="tgl" style="--on:var(--cmp)"><input type="checkbox" id="show-c" checked><span class="sw"></span><span class="t">Components</span></label>
    </div>
  </div>

  <div class="readouts">
    <div class="ro"><span class="k">\(\theta_2\)</span><span class="v" id="r-th2">—</span></div>
    <div class="ro"><span class="k" id="k-e">\(\vert\mathbf{E}_2\vert / \vert\mathbf{E}_1\vert\)</span><span class="v" id="r-e">—</span></div>
    <div class="ro"><span class="k" id="k-d">\(\vert\mathbf{D}_2\vert / \vert\mathbf{D}_1\vert\)</span><span class="v" id="r-d">—</span></div>
    <div class="ro"><span class="k">\(\tan\theta_1 / \tan\theta_2\)</span><span class="v" id="r-tan">—</span></div>
  </div>
</div>

<script>
'use strict';

const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SANS='Inter, system-ui, -apple-system, sans-serif';
function stext(ctx,str,x,y,px,color,align,bold){ ctx.fillStyle=color; ctx.font=(bold?'700 ':'')+px+'px '+SANS; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(str,x,y); }

// Region 1 above the boundary, region 2 below; n points from 2 into 1 (up).
// No free surface charge, so the boundary conditions are
//   E_t2 = E_t1                    (tangential E continuous)
//   eps2 E_n2 = eps1 E_n1          (normal D continuous)
// The field crosses from region 1 down into region 2. theta is measured from
// the normal, so tan(theta) = |E_t| / |E_n|.
//
// ?mode=mag (L31) runs the same geometry for magnetostatics with no surface
// current: H takes the place of E (tangential H continuous), B the place of D
// (normal B continuous), and mu_r the place of eps_r. The mu_r sliders are
// logarithmic, 1 to 1000, so iron fits on them. The variable names stay e1,
// e2, D for both modes.
const MAG = new URLSearchParams(location.search).get('mode') === 'mag';
const SYM = MAG ? { f: 'H', g: 'B', m: '\\mu' } : { f: 'E', g: 'D', m: '\\epsilon' };
const state = { e1: 1, e2: MAG ? 100 : 4, th1: MAG ? 10 : 30 };
if (MAG) {
  document.title = 'The magnetic field at a material boundary';
  document.getElementById('plot').setAttribute('aria-label', 'Magnetic field lines bending at the boundary between two magnetic materials');
  document.getElementById('l-1').textContent = '\\(\\mu_{r1}\\)';
  document.getElementById('l-2').textContent = '\\(\\mu_{r2}\\)';
  document.getElementById('l-d').textContent = 'Show B';
  document.getElementById('k-e').textContent = '\\(\\vert\\mathbf{H}_2\\vert / \\vert\\mathbf{H}_1\\vert\\)';
  document.getElementById('k-d').textContent = '\\(\\vert\\mathbf{B}_2\\vert / \\vert\\mathbf{B}_1\\vert\\)';
  for (const id of ['e1', 'e2']) {             // slider position = log10(mu_r)
    const el = document.getElementById(id);
    el.min = '0'; el.max = '3'; el.step = '0.01';
    el.value = String(Math.log10(state[id]));
  }
}
const fromSlider = v => MAG ? Math.pow(10, parseFloat(v)) : parseFloat(v);
const fmtR = v => MAG ? (v < 9.95 ? v.toFixed(1) : v.toFixed(0)) : v.toFixed(1);
function fields() {
  const t = state.th1 * Math.PI / 180;
  const Et = Math.sin(t), En1 = Math.cos(t);               // |E1| = 1
  const En2 = En1 * state.e1 / state.e2;
  const th2 = Math.atan2(Et, En2);
  const E2 = Math.hypot(Et, En2);
  return { t1: t, th2, Et, En1, En2, E1: 1, E2, D1: state.e1, D2: state.e2 * E2 };
}

// ---- controls ----
const e1El = document.getElementById('e1'), e2El = document.getElementById('e2'), thEl = document.getElementById('th');
const dEl = document.getElementById('show-d'), cEl = document.getElementById('show-c');
function onInput() {
  state.e1 = fromSlider(e1El.value); state.e2 = fromSlider(e2El.value); state.th1 = parseFloat(thEl.value);
  document.getElementById('e1-val').textContent = fmtR(state.e1);
  document.getElementById('e2-val').textContent = fmtR(state.e2);
  document.getElementById('th-val').textContent = state.th1.toFixed(1) + '°';
  draw();
}
for (const el of [e1El, e2El, thEl]) el.addEventListener('input', onInput);
dEl.addEventListener('change', draw);
cEl.addEventListener('change', draw);
if (MAG) {                        // the readouts beside the sliders start at the mag defaults
  thEl.value = String(state.th1);
  document.getElementById('e1-val').textContent = fmtR(state.e1);
  document.getElementById('e2-val').textContent = fmtR(state.e2);
  document.getElementById('th-val').textContent = state.th1.toFixed(1) + '°';
}

// ---- canvas ----
const canvas = document.getElementById('plot');
const ctx = canvas.getContext('2d');

/* clientWidth, not getBoundingClientRect(): the rect includes the 1px border,
   and a bitmap sized from it comes out stretched. With box-sizing:border-box,
   style.height sets the OUTER height, so hand the border back. */
function cvWidth(cv){ return Math.max(240, cv.clientWidth || Math.floor(cv.getBoundingClientRect().width)); }
function setSize(cv,wCss,hCss,dpr){
  cv.width=Math.round(wCss*dpr); cv.height=Math.round(hCss*dpr);
  cv.style.height=hCss+'px';
  const bh=cv.offsetHeight-cv.clientHeight;
  if(bh) cv.style.height=(hCss+bh)+'px';
}
/* Narrower than DESIGN_W, scale the whole drawing down rather than clamp it,
   so the labels shrink together and nothing collides. */
const DESIGN_W=360;
let SCL=1;
/* Narrow: the controls and readouts stack, so give the canvas a shorter
   design box to keep the widget inside its frame budget. */
var __SQ_MQ = window.matchMedia ? window.matchMedia('(max-width:430px)') : null;
function SQ(h){ return (__SQ_MQ && __SQ_MQ.matches) ? Math.round(h * 0.62) : h; }
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const wCss = cvWidth(canvas);
  SCL = Math.min(1, wCss / DESIGN_W);
  const w = wCss / SCL;
  const h = SQ(Math.max(280, Math.min(w * 0.40, 340)));
  setSize(canvas, wCss, h * SCL, dpr);
  ctx.setTransform(dpr*SCL,0,0,dpr*SCL,0,0);
  draw();
}
window.addEventListener('resize', fit);

function arrowTo(x0, y0, x1, y1, color, lw, head) {
  const a = Math.atan2(y1 - y0, x1 - x0), L = Math.hypot(x1 - x0, y1 - y0);
  if (L < 1) return;
  const hd = Math.min(head, L * 0.6);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x0, y0);
  ctx.lineTo(x1 - hd * 0.8 * Math.cos(a), y1 - hd * 0.8 * Math.sin(a)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - hd * Math.cos(a - 0.38), y1 - hd * Math.sin(a - 0.38));
  ctx.lineTo(x1 - hd * Math.cos(a + 0.38), y1 - hd * Math.sin(a + 0.38));
  ctx.closePath(); ctx.fill();
}
function shade(er) {           // a deeper blue for a larger permittivity
  const k = MAG ? Math.log10(er) / 3 : (er - 1) / 9;
  const mix = (a, b) => Math.round(a + (b - a) * k);
  return `rgb(${mix(246,190)},${mix(250,214)},${mix(253,236)})`;
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width/(dpr*SCL), h = canvas.height/(dpr*SCL);
  ctx.clearRect(0,0,w,h);
  const F = fields();
  const cy = h / 2, cx = w * 0.5;

  // the two regions
  ctx.fillStyle = shade(state.e1); ctx.fillRect(0, 0, w, cy);
  ctx.fillStyle = shade(state.e2); ctx.fillRect(0, cy, w, h - cy);
  MJ.draw(ctx, SYM.m + '_1', 12, 18, 15, cssVar('--ink'), 'left');
  MJ.draw(ctx, SYM.m + '_2', 12, h - 18, 15, cssVar('--ink'), 'left');

  // field lines: each crosses the boundary at x_i and bends there. Spacing
  // along the boundary is the same on both sides, because the normal flux of
  // D is continuous.
  const gap = 46;
  const u1 = [Math.sin(F.t1), Math.cos(F.t1)];            // canvas: +y is down
  const u2 = [Math.sin(F.th2), Math.cos(F.th2)];
  const far = 2 * Math.hypot(w, h);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
  ctx.lineWidth = 1.2;
  const K = Math.ceil(far / gap);
  for (let k = -K; k <= K; k++) {
    if (k === 0) continue;                 // the highlighted vectors sit there
    const x = cx + k * gap;
    ctx.strokeStyle = 'rgba(0,74,133,0.30)';
    ctx.beginPath(); ctx.moveTo(x - u1[0] * far, cy - u1[1] * far); ctx.lineTo(x, cy); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,103,185,0.30)';
    ctx.beginPath(); ctx.moveTo(x, cy); ctx.lineTo(x + u2[0] * far, cy + u2[1] * far); ctx.stroke();
  }
  ctx.restore();

  // the boundary and its normal
  ctx.strokeStyle = cssVar('--ink'); ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
  ctx.strokeStyle = '#9fb6cc'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(cx, 8); ctx.lineTo(cx, h - 8); ctx.stroke();
  ctx.setLineDash([]);

  // the highlighted vectors, E or D, scaled so the larger fills the room
  const useD = dEl.checked;
  const m1 = useD ? F.D1 : F.E1, m2 = useD ? F.D2 : F.E2;
  const room = cy - 26;
  const s = room / Math.max(m1, m2);
  const L1 = m1 * s, L2 = m2 * s;
  const p1 = [cx - u1[0] * L1, cy - u1[1] * L1];
  const p2 = [cx + u2[0] * L2, cy + u2[1] * L2];
  const sym = useD ? SYM.g : SYM.f;

  if (cEl.checked) {
    // components: tangential (horizontal) and normal (vertical), dashed
    ctx.setLineDash([5,4]); ctx.lineWidth = 1.5; ctx.strokeStyle = cssVar('--cmp');
    ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(cx, p1[1]); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(p2[0], cy); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
    ctx.setLineDash([]);
    // angles from the normal
    const r = 30;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI/2 - F.t1, -Math.PI/2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI/2 - F.th2, Math.PI/2); ctx.stroke();
    if (F.t1 > 0.12) MJ.draw(ctx, '\\theta_1', cx - r * Math.sin(F.t1/2) - 6, cy - r * Math.cos(F.t1/2) - 9, 13, cssVar('--cmp'), 'right');
    if (F.th2 > 0.12) MJ.draw(ctx, '\\theta_2', cx + r * Math.sin(F.th2/2) + 8, cy + r * Math.cos(F.th2/2) + 9, 13, cssVar('--cmp'), 'left');
  }

  arrowTo(p1[0], p1[1], cx, cy, cssVar('--f1'), 3, 13);
  arrowTo(cx, cy, p2[0], p2[1], cssVar('--f2'), 3, 13);
  MJ.draw(ctx, '\\mathbf{' + sym + '}_1', (p1[0] + cx) / 2 - 10, (p1[1] + cy) / 2, 16, cssVar('--f1'), 'right');
  MJ.draw(ctx, '\\mathbf{' + sym + '}_2', (p2[0] + cx) / 2 - 10, (p2[1] + cy) / 2 + 4, 16, cssVar('--f2'), 'right');

  stext(ctx, 'region 1', w - 10, 16, 12, cssVar('--ink3'), 'right', true);
  stext(ctx, 'region 2', w - 10, h - 16, 12, cssVar('--ink3'), 'right', true);

  updateReadout(F);
}

function updateReadout(F) {
  document.getElementById('r-th2').textContent = (F.th2 * 180 / Math.PI).toFixed(1) + '°';
  document.getElementById('r-e').textContent = (F.E2 / F.E1).toFixed(3);
  document.getElementById('r-d').textContent = (F.D2 / F.D1).toFixed(3);
  document.getElementById('r-tan').textContent = state.th1 < 0.05 ? '—' : (state.e1 / state.e2).toFixed(3);
}

fit();

MJ.setRedraw(()=>draw());
MJ.onReady(()=>{ MJ.typeset(document.body).then(()=>draw()); draw(); });
</script>
</body>
</html>
